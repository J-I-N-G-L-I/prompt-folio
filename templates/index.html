<!doctype html>
<html lang="@@LANG@@" dir="@@DIR@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="@@DESCRIPTION@@">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f0">
<meta property="og:type" content="website">
<meta property="og:title" content="@@PAGE_TITLE@@">
<meta property="og:description" content="@@DESCRIPTION@@">
<meta property="og:url" content="@@CANONICAL@@">
<link id="canonical" rel="canonical" href="@@CANONICAL@@">
@@ALTERNATES@@
<meta property="og:image" content="@@SITE_URL@@assets/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="@@ROOT@@favicon.ico?v=folio-3" sizes="16x16 32x32 48x48">
<link rel="icon" href="@@ROOT@@favicon.svg?v=folio-3" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="@@ROOT@@apple-touch-icon.png?v=folio-3" sizes="180x180">
<title>@@PAGE_TITLE@@</title>
<style>
@@CSS@@
</style>
</head>
<body>
@@SYMBOLS@@
<a class="skip" id="skip" href="#main">@@SKIP@@</a>
<div class="wrap">
<header class="topbar">
  <a class="brand" href="@@HOME@@" id="brand" data-nav dir="ltr"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#2c5745"/><g fill="none" stroke="#fffef8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17c7-2 13-1 19 3 6-4 12-5 19-3v31c-7-2-13-1-19 3-6-4-12-5-19-3Z"/><path d="M32 20v31M21 28h4M39 28h4"/></g></svg><span class="brand-title">@@SITE_TITLE@@<span class="brand-sub">@@BRAND_SUB@@</span></span></a>
  <div class="top-actions"><a class="repo" id="repo" href="@@REPO_URL@@" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><svg class="icon small-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-github"/></svg>GitHub<svg class="icon small-icon flip" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-external"/></svg></a><div class="language-control"><label for="language" id="language-label">@@LANG_LABEL@@</label><select id="language" aria-labelledby="language-label">@@LANG_OPTIONS@@</select></div></div>
</header>
<div class="app-layout"><aside class="sidebar" id="sidebar" aria-label="@@BRAND_SUB@@">@@STATIC_NAV@@</aside><main class="main" id="main" tabindex="-1">@@STATIC_HOME@@</main></div>
<footer class="footer"><p id="privacy">@@PRIVACY@@</p><div class="footer-links"><a id="footer-guide" href="@@GUIDE@@">@@GUIDE_LABEL@@</a><a id="readme" href="@@REPO_URL@@#readme" target="_blank" rel="noopener noreferrer">README</a><a id="license" href="@@ROOT@@LICENSE">@@LICENSE_LABEL@@</a></div></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<noscript><div class="no-js">@@NOJS@@</div></noscript>
<script id="page-data" type="application/json">@@PAGE_DATA@@</script>
<script id="library-data" type="application/json">@@DATA@@</script>
<script>
@@APP_JS@@
</script>
</body>
</html>
